<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusVibe - Sign Up</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <div class="logo">
            ⚡
        </div>

        <h1>CREATE ACCOUNT</h1>

        <form id="signupForm">

            <div class="input-group">
                <label for="name">Full Name</label>
                <input 
                    type="text" 
                    id="name"
                    placeholder="Enter your full name"
                >
            </div>

            <div class="input-group">
                <label for="email">University Email</label>
                <input 
                    type="email" 
                    id="email"
                    placeholder="Enter your university email"
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password"
                    placeholder="Create a password"
                >
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirm-password"
                    placeholder="Confirm your password"
                >
            </div>

            <button type="submit" id="signupButton" disabled>SIGN UP</button>

        </form>

        <p class="signup-text">
            Already have an account?
            <a href="index.html">LOGIN</a>
        </p>

    </main>
<script>
    const name = document.getElementById("name");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirm-password");
    const signupButton = document.getElementById("signupButton");

    function checkSignupFields() {
        if (
            name.value.trim() !== "" &&
            email.value.trim() !== "" &&
            password.value.trim() !== "" &&
            confirmPassword.value.trim() !== ""
        ) {
            signupButton.disabled = false;
            signupButton.classList.add("active");
        } else {
            signupButton.disabled = true;
            signupButton.classList.remove("active");
        }
    }

    name.addEventListener("input", checkSignupFields);
    email.addEventListener("input", checkSignupFields);
    password.addEventListener("input", checkSignupFields);
    confirmPassword.addEventListener("input", checkSignupFields);
</script>

</body>
</html>
