<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusVibe - Sign Up</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <div class="logo">
    <span>ϟ</span>
</div>

        <h1>CREATE ACCOUNT</h1>

        <form id="signupForm">

    <div class="input-group">
        <input 
            type="text" 
            id="name"
            placeholder="Full Name"
        >
    </div>

    <div class="input-group">
        <input 
            type="email" 
            id="email"
            placeholder="University Email"
        >
    </div>

    <div class="input-group">
        <input 
            type="password" 
            id="password"
            placeholder="Password"
        >
    </div>

    <div class="input-group">
        <input 
            type="password" 
            id="confirm-password"
            placeholder="Confirm Password"
        >
    </div>

    <button type="submit" id="signupButton" disabled>SIGN UP</button>

</form>

        <p class="signup-text">
            Already have an account?
            <a href="index.html">LOGIN</a>
        </p>

    </main>
<script>
    const name = document.getElementById("name");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirm-password");
    const signupButton = document.getElementById("signupButton");

    function checkSignupFields() {
        if (
            name.value.trim() !== "" &&
            email.value.trim() !== "" &&
            password.value.trim() !== "" &&
            confirmPassword.value.trim() !== ""
        ) {
            signupButton.disabled = false;
            signupButton.classList.add("active");
        } else {
            signupButton.disabled = true;
            signupButton.classList.remove("active");
        }
    }

    name.addEventListener("input", checkSignupFields);
    email.addEventListener("input", checkSignupFields);
    password.addEventListener("input", checkSignupFields);
    confirmPassword.addEventListener("input", checkSignupFields);
</script>

</body>
</html>
